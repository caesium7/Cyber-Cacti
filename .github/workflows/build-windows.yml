
name: Build Cyber Cacti Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Cyber Cacti
        run: >
          dotnet publish ./CyberCacti/CyberCacti.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Attach EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CyberCacti.exe
