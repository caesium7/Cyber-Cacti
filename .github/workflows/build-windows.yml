
name: Build Cyber Cacti for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows application
        run: dotnet publish CyberCacti/CyberCacti.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CyberCacti-Windows
          path: publish/
          if-no-files-found: error
